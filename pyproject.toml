[project]
name = "pattern-language"
version = "0.0.0"
description = "Schema gate for a pattern-language catalog."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
