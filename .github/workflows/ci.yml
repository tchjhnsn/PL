name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run python scripts/validate_catalog.py
      - run: uv run python scripts/catalog_to_lean.py --check
      - run: uv run pl check fixtures/pass-house.ifc --language projects/seed-house.json

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
